name: MysticCraft
version: '1.0.0'
main: com.canopycreations.mysticcraft.MysticCraft
api-version: '26.2'
author: CanopyCreations
description: Vampire Diaries-inspired supernatural races - Vampires, Werewolves, Witches

commands:
  race:
    description: View or manage your supernatural race
    usage: /race [set|info|humanity|list]
  vampire:
    description: Vampire ability commands
    usage: /vampire <compel|feed|toggle>
  werewolf:
    description: Werewolf ability commands
    usage: /werewolf <shift|info>
  witch:
    description: Witch spellcasting commands
    usage: /witch <cast|list> [spell]
  mystic:
    description: Admin commands for MysticCraft
    usage: /mystic <reload|setrace|humanity|moon|originals|bloodline|progenitor|keeper>
  clan:
    description: Found and manage a coven, pack, court or order
    usage: /clan <create|invite|join|leave|claim|info|list|ally|enemy>
    aliases: [c, faction, f]
  lore:
    description: Read the codex - the mythology of this world
    usage: /lore [found|read|origins|progenitors|bloodlines|names|town]
    aliases: [codex]
  quest:
    description: See where you are in your story
    usage: /quest
    aliases: [story, q]

permissions:
  mysticcraft.admin:
    description: Access to MysticCraft admin commands
    default: op
  mysticcraft.play:
    description: Access to race abilities
    default: true
